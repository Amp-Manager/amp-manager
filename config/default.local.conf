# Allow Tunnel
server {
    listen 8080;
    server_name {{DOMAIN}};

    status_zone {{DOMAIN}};
    resolver 127.0.0.11 valid=30s;
    set $upstream_php php;
    
    root /www/{{DOMAIN}};
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php$ {
        fastcgi_pass $upstream_php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
        fastcgi_param PHP_VALUE "error_log=/var/log/php/{{DOMAIN}}.error.log";
        add_header X-FastCGI-Cache $upstream_cache_status always;
    }
    
    # Logging
    access_log /var/log/angie/{{DOMAIN}}.access.log;
    error_log  /var/log/angie/{{DOMAIN}}.error.log warn;

}

# HTTP Redirect to HTTPS
server {
    listen 80;
    server_name {{DOMAIN}};
    return 301 https://$host$request_uri;
}

# Main SSL
server {
    listen 443 ssl;
    http2 on;

    server_name {{DOMAIN}};

    status_zone {{DOMAIN}};
    resolver 127.0.0.11 valid=30s;
    set $upstream_php php;

    ssl_certificate     /etc/angie/certs/{{DOMAIN}}.pem;
    ssl_certificate_key /etc/angie/certs/{{DOMAIN}}-key.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    add_header X-Served-By "Angie DEV - {{DOMAIN}}" always;

    root /www/{{DOMAIN}};
    index index.php index.html;

    error_page 404 /error-pages/404.php;
    error_page 500 502 503 504 /error-pages/50x.php;
    error_page 503 /error-pages/maintenance.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $upstream_php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Per-domain PHP Error Log
        fastcgi_param PHP_VALUE "error_log=/var/log/php/{{DOMAIN}}.error.log";
        
        fastcgi_intercept_errors on;

        # Disable for development to ensure we always get the full response for debugging
        # fastcgi_cache fastcgi_cache;
        # fastcgi_cache_valid 200 302 10m;
        # fastcgi_cache_valid 404 1m;

        # or using shorten cache TTL to 10 seconds for development
        # and production-like caching behavior without long waits
        fastcgi_cache_valid 200 302 10s;   
        fastcgi_cache_valid 404 1s;
   
        # Angie key to store and look up cached PHP responses 
        # Re-enable for production-like
        #fastcgi_cache_key "$scheme$request_method$host$request_uri";

        # Required for custom dashboard Cache API HIT/MISS/BYPASS
        add_header X-FastCGI-Cache $upstream_cache_status always;
    }

    # Error pages logic: Try project folder first, then global fallback
    location ~ ^/error-pages/(.*\.php)$ {
        internal;
        set $error_file $1;
        
        # Try project's own error pages first
        # If not found, alias to the global ones mounted in the container
        try_files /error-pages/$error_file @global_errors;

        fastcgi_pass $upstream_php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/php/{{DOMAIN}}.error.log";
    }

    location @global_errors {
        internal;
        root /usr/share/angie;
        fastcgi_pass $upstream_php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/angie/error-pages/$error_file;
        fastcgi_param PHP_VALUE "error_log=/var/log/php/{{DOMAIN}}.error.log";
    }

    access_log /var/log/angie/{{DOMAIN}}.access.log;
    error_log  /var/log/angie/{{DOMAIN}}.error.log warn;
}