
# package: angie-module-brotli
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

# package: angie-module-subs
load_module modules/ngx_http_subs_filter_module.so;

# ANGIE MAIN CONFIG
user  root;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/angie/error.log notice;
pid        /run/angie/angie.pid;

events {
    worker_connections  65536;
}

http {
    include       /etc/angie/mime.types;

    default_type  application/octet-stream;
   
    fastcgi_cache_path /var/cache/angie levels=1:2 keys_zone=fastcgi_cache:10m inactive=60m max_size=500m use_temp_path=off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format extended '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" rt="$request_time" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'h="$host" sn="$server_name" ru="$request_uri" u="$uri" '
                        'ucs="$upstream_cache_status" ua="$upstream_addr" us="$upstream_status" '
                        'uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log  /var/log/angie/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;
    
    # Required for custom dashboard Cache API HIT/MISS/BYPASS
    add_header X-FastCGI-Cache $upstream_cache_status always;

    # Internal Status API (for UI Monitor)
    # Defined BEFORE includes to ensure it catches localhost requests without redirects
    server {
        listen 80;
        server_name localhost;
        status_zone localhost;

        location /status/api/ {
            # CORS headers for the dashboard
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            api /status/;
            allow all;
        }

        # Health check
        location /health {
            return 200 'OK';
        }
    }

    include /etc/angie/http.d/*.conf;
}

