name: Build & Release AMP-Manager

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Clean Build Artifacts
        shell: pwsh
        run: |
          Write-Host "Cleaning old build artifacts..."
          if (Test-Path "dist") { Remove-Item -Path "dist" -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path "resources.neu") { Remove-Item -Path "resources.neu" -Force -ErrorAction SilentlyContinue }
          Write-Host "Clean complete"

      - name: Build UI
        run: npm run build

      - name: Build Neutralino Binary
        run: |
          npx neu update
          npx neu build

      - name: Verify Build Output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Recurse -Filter "amp-manager-win_x64.exe" | Select-Object -First 1
          if ($null -eq $exe) { 
            Write-Host "ERROR: amp-manager-win_x64.exe not found"
            exit 1
          }
          Write-Host "Found: $($exe.FullName)"

      - name: Apply UAC + Build Release Tree (CI mode)
        env:
          CI: true
        shell: cmd
        timeout-minutes: 5
        run: .\post-build.bat

      - name: Verify release structure
        shell: pwsh
        run: |
          $required = @(
            "amp-manager/amp-manager-win_x64.exe",
            "amp-manager/resources.neu",
            "amp-manager/amp-tasks.bat",
            "amp-manager/docker-compose.yml",
            "amp-manager/.env",
            "amp-manager/LICENSE",
            "amp-manager/config",
            "amp-manager/www"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { 
              Write-Error "Missing required file: $item"
              exit 1 
            }
          }
          Write-Host "Release structure verified."

      - name: Create release ZIP
        shell: pwsh
        run: |
          $zipName = "AMP-Manager-${{ env.VERSION }}-win-x64.zip"
          Compress-Archive -Path "amp-manager\*" -DestinationPath $zipName -Force
          Write-Host "Created: $zipName"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMP-Manager-release
          path: AMP-Manager-${{ env.VERSION }}-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AMP-Manager-${{ env.VERSION }}-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}