name: Build & Release AMP-Manager

on:
  push:
    tags:
      - 'v*.*.*'  # Matches v1.0.0, v1.0.1, etc. (at least 3 parts required)
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .

      - name: Debug - Show directory structure
        run: |
          Write-Host "GH_WORKSPACE: $env:GITHUB_WORKSPACE"
          Write-Host "Current dir: $(Get-Location)"
          Write-Host "Contents:"
          Get-ChildItem -Path . -Name

      - name: Clean previous build artifacts
        run: |
          if (Test-Path "dist") { Remove-Item -Path "dist" -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npx vite build

      - name: Build Neutralino app (Release)
        run: npx neu build --release

      - name: Verify build output
        run: |
          Write-Host "Checking dist folder..."
          Get-ChildItem -Path "dist" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          if (-not (Test-Path "dist/amp-manager/amp-manager-win_x64.exe")) {
            throw "Neutralino build failed - executable not found"
          }
          Write-Host "Build verified successfully"

      - name: Clean non-Windows platforms
        run: |
          Get-ChildItem -Path "dist/amp-manager" -Directory | 
            Where-Object { $_.Name -match 'linux|mac|arm' } | 
            Remove-Item -Recurse -Force
        shell: pwsh

      - name: Apply UAC + Build Release Tree
        env:
          CI: true
        shell: cmd
        timeout-minutes: 5
        run: .\post-build.bat

      - name: Verify release structure
        run: |
          $required = @(
            "amp-manager/amp-manager-win_x64.exe",
            "amp-manager/resources.neu",
            "amp-manager/amp-tasks.bat",
            "amp-manager/docker-compose.yml",
            "amp-manager/.env",
            "amp-manager/LICENSE",
            "amp-manager/config",
            "amp-manager/www"
          )
          $missing = @()
          foreach ($item in $required) {
            if (-not (Test-Path $item)) {
              $missing += $item
            }
          }
          if ($missing) {
            Write-Host "Missing files:" $missing
            exit 1
          }
          Write-Host "Release structure verified"

      - name: Create release ZIP
        run: |
          $zipName = "AMP-Manager-${{ env.VERSION }}-win-x64.zip"
          Compress-Archive -Path "amp-manager\*" -DestinationPath $zipName -Force
          Write-Host "Created: $zipName"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMP-Manager-release
          path: AMP-Manager-${{ env.VERSION }}-win-x64.zip

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AMP-Manager-${{ env.VERSION }}-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}